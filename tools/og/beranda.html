<!doctype html>
<!-- Gambar pratinjau tautan (public/og/beranda.jpg, 1200×630). Render: buka file ini di Chrome headless 1200×630, simpan
     sebagai JPEG kualitas ±85 (DECISIONS 099). Isi = hero beranda: label spesialis, "Atap bitumen, / harga masuk akal.",
     tiga keunggulan, logo Λtapura. Huruf Inter (satu-satunya huruf situs), tanpa italic. -->
<html lang="id"><head><meta charset="utf-8"><style>
@font-face { font-family: Inter; src: url(../../public/fonts/Inter-Variable-latin.woff2) format('woff2'); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; color: #10231e; position: relative; }
.foto { position: absolute; inset: 0; background: url(../../assets/gambar/magnific/hero-desktop.jpg) 72% 58% / 1340px auto no-repeat; }
.kabut { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(242 244 241 / 0.97) 0%, rgb(242 244 241 / 0.9) 40%, rgb(242 244 241 / 0) 66%); }
.isi { position: absolute; left: 72px; top: 70px; bottom: 60px; width: 720px; display: flex; flex-direction: column; }
.label { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: #fff; font-size: 19px; font-weight: 500; box-shadow: 0 1px 2px rgb(16 35 30 / 0.08); }
.label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #10231e; }
h1 { margin-top: 34px; font-size: 76px; font-weight: 600; letter-spacing: -0.033em; line-height: 1; }
h1 span { display: block; opacity: 0.55; }
.bukti { margin-top: 30px; padding: 0; display: flex; gap: 26px; white-space: nowrap; font-size: 19px; font-weight: 500; color: #24302b; }
.bukti li { list-style: none; display: inline-flex; align-items: center; gap: 8px; }
.bukti li::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: #c6f24e; box-shadow: inset 0 0 0 1px rgb(16 35 30 / 0.25); }
.logo { margin-top: auto; align-self: flex-start; height: 40px; width: auto; }
</style></head><body>
<div class="foto"></div><div class="kabut"></div>
<div class="isi">
  <span class="label">Spesialis jasa pasang genteng aspal · Jabodetabek</span>
  <h1>Atap bitumen,<span>harga masuk akal.</span></h1>
  <ul class="bukti"><li>Material lengkap</li><li>Jasa pasang tuntas</li><li>Bisa sekalian rangka</li></ul>
  <img class="logo" src="../../public/brand/atapura-logo.svg" alt="Atapura">
</div>
</body></html>
