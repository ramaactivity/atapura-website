name: Deploy ke Vercel (produksi)

# Jalur deploy = GitHub Actions + VERCEL_TOKEN, bukan sambungan Git bawaan Vercel:
# satu akun GitHub dipakai banyak proyek yang tersebar di beberapa akun Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Dipanggil sinkron-ops.yml setelah commit data dari Ops.
  workflow_call:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_E2sc4rJv4neVvRPpJubDdAqr
  VERCEL_PROJECT_ID: prj_R9OCxzPUAjRnUTZR4Uavihp5QK36

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Selalu ujung main: saat dipanggil workflow sinkron, commit datanya baru dibuat setelah pemicu.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pasang Vercel CLI
        run: npm install -g vercel@latest
      - name: Ambil setelan proyek Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # Wajib di Hobby: tanpa ini deploy ke-block "commit email could not be matched".
      - name: Buang metadata git (deploy atas nama pemilik token)
        run: rm -rf .git
      - name: Deploy produksi (build di Vercel)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
