name: Sinkron harga dari Atapura Ops

# Ops = sumber angka (Ops DECISIONS 123, website DECISIONS 055). Tiap jam: tarik GET /api/publik/katalog → src/data/ops.json.
# Bila berubah: tes kalkulator, buat ulang PDF product knowledge, commit, lalu deploy (push oleh GITHUB_TOKEN tidak memicu
# deploy.yml, jadi deploy dipanggil langsung). Tidak berubah = tidak ada commit/deploy.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sinkron-ops]

permissions:
  contents: write

concurrency:
  group: sinkron-ops
  cancel-in-progress: false

jobs:
  tarik:
    runs-on: ubuntu-latest
    outputs:
      berubah: ${{ steps.simpan.outputs.berubah }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tarik angka dari Ops
        env:
          SINKRON_SECRET: ${{ secrets.SINKRON_SECRET }}
          OPS_URL: ${{ vars.OPS_URL }}
        # stderr juga ditulis ke berkas supaya pesan galatnya bisa dilaporkan ke Ops (langkah terakhir).
        run: node scripts/tarik-ops.mjs 2> >(tee -a sinkron-galat.txt >&2)
      # Artikel (DECISIONS 067): kirim daftar artikel ke Ops, tarik slug yang ditahan pemilik. Gagal = peringatan, daftar lama dipakai.
      - name: Sinkron artikel dengan Ops
        env:
          SINKRON_SECRET: ${{ secrets.SINKRON_SECRET }}
          OPS_URL: ${{ vars.OPS_URL }}
        run: node scripts/artikel-ops.mjs || echo "::warning::Sinkron artikel dengan Ops gagal; daftar artikel ditahan yang lama tetap dipakai."
      - id: beda
        run: |
          if git diff --quiet -- src/data/ops.json; then echo "ada=false" >> "$GITHUB_OUTPUT"; else echo "ada=true" >> "$GITHUB_OUTPUT"; fi
          if git diff --quiet -- src/data/artikel-ditahan.json; then echo "artikel=false" >> "$GITHUB_OUTPUT"; else echo "artikel=true" >> "$GITHUB_OUTPUT"; fi
      - name: Tes kalkulator dengan angka baru
        if: steps.beda.outputs.ada == 'true'
        run: node --experimental-strip-types --no-warnings src/data/harga.test.ts 2> >(tee -a sinkron-galat.txt >&2)
      - name: Buat ulang PDF product knowledge
        if: steps.beda.outputs.ada == 'true'
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm ci
          npm run build
          node tools/pricelist/render.mjs public/unduh/product-knowledge-atapura.pdf /internal/product-knowledge
      - id: simpan
        name: Commit
        run: |
          if [ "${{ steps.beda.outputs.ada }}" != "true" ] && [ "${{ steps.beda.outputs.artikel }}" != "true" ]; then echo "berubah=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "ramaactivity"
          git config user.email "rama.activity98@gmail.com"
          git add src/data/ops.json src/data/artikel-ditahan.json public/unduh/product-knowledge-atapura.pdf
          git commit -m "chore(data): sinkron dari Atapura Ops $(node -p "require('./src/data/ops.json').versi") — harga ${{ steps.beda.outputs.ada }}, artikel ditahan ${{ steps.beda.outputs.artikel }}"
          git push
          echo "berubah=true" >> "$GITHUB_OUTPUT"
      # Ops DECISIONS 234: lapor berhasil/gagal ke Ops (Hari ini pemilik menampilkan sinkron yang gagal). Jalan walau langkah lain gagal.
      - name: Lapor hasil ke Ops
        if: always()
        env:
          SINKRON_SECRET: ${{ secrets.SINKRON_SECRET }}
          OPS_URL: ${{ vars.OPS_URL }}
        run: node scripts/lapor-ops.mjs "${{ job.status }}"

  deploy:
    needs: tarik
    if: needs.tarik.outputs.berubah == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
